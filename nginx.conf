# NGINX config for the Nexus SPA container.
#
# Two things here are not optional, and the image had neither — it used the
# stock nginx config, which serves a directory and nothing else:
#
#  1. **The SPA fallback.** Without `try_files ... /index.html`, every route
#     the app owns 404s the moment it is requested directly: refreshing
#     /seller/orders, following an emailed link to /checkout/complete, or
#     opening any bookmark. Only the bare "/" worked.
#
#  2. **The /api and /uploads proxy.** The frontend is built with
#     `VITE_API_URL=/api`, a relative path — so in the browser it resolves
#     against this origin, on port 80. Nothing routed it anywhere, so every
#     request from the deployed SPA hit nginx and came back as the index page.
#     In dev, Vite's own proxy does this job; nothing did it in the container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS terminator, let the app see the real client and scheme.
    # The API reads these to resolve req.ip for rate limiting and req.protocol
    # for the absolute upload URLs it returns.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # Security headers for the app origin. The API sets its own; these cover
    # the documents and assets nginx serves, which the API's helmet never saw.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    client_max_body_size 12m;   # above the API's own 10 MB upload ceiling

    # The API.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        # Speech transcription is CPU-bound and can run well past the 60s
        # default before it answers.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded product images, served by the API from its own disk.
    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build output: immutable, so cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a route the SPA owns.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
}
