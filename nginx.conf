# NGINX config for the Nexus container: TLS terminator, SPA host and API proxy.
#
# Four things here are not optional, and the image originally had none of them
# — it used the stock nginx config, which serves a directory and nothing else:
#
#  1. **The SPA fallback.** Without `try_files ... /index.html`, every route
#     the app owns 404s the moment it is requested directly: refreshing
#     /seller/orders, following an emailed link to /checkout/complete, or
#     opening any bookmark. Only the bare "/" worked.
#
#  2. **The /api and /uploads proxy.** The frontend is built with
#     `VITE_API_URL=/api`, a relative path — so in the browser it resolves
#     against this origin. Nothing routed it anywhere, so every request from
#     the deployed SPA hit nginx and came back as the index page. In dev,
#     Vite's own proxy does this job; nothing did it in the container.
#
#  3. **TLS.** The session cookie is `SameSite=None; Secure` in production, so
#     a browser silently discards it over plain HTTP: every login appears to
#     succeed and the next request is anonymous. DEPLOYMENT.md said to
#     "terminate TLS in front of the frontend container" and nothing did — so
#     there was no configuration in the repo on which login could work.
#
#  4. **The real client IP.** Behind Cloudflare, every request arrives from a
#     Cloudflare edge address. Without `real_ip`, the API's rate limiters see
#     one client for the whole internet and a single visitor can lock out
#     everybody.

# --- Real client IP -----------------------------------------------------------
#
# This file is included inside the stock `http {}` block, so these apply to
# both server blocks below.
#
# `CF-Connecting-IP` is trusted ONLY when the request actually came from a
# Cloudflare address. That condition is the entire security property: the header
# is client-supplied data on any other path, and honouring it unconditionally
# would let a caller hitting the origin IP directly choose its own rate-limit
# identity — the same mistake as `trust proxy: true`.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched
# 2026-10-17). They change rarely; re-check them when adding a region.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Port 80 ------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The container healthcheck runs `wget --spider http://127.0.0.1/health`,
    # which follows redirects — so this must answer on 80 and sit *before* the
    # redirect, or the container reports itself unhealthy forever.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # No ACME challenge path: the origin certificate is issued by Cloudflare
    # and is not renewed over HTTP. Everything else goes to TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 -----------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # A Cloudflare Origin Certificate: valid 15 years, trusted by Cloudflare in
    # "Full (strict)" mode, and not a publicly-trusted cert — which is fine,
    # because Cloudflare is the only thing that should ever connect here. It
    # needs no renewal cron, which is why it is preferred over certbot on a box
    # whose port 80 is closed to the world.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # What the API sees. `X-Forwarded-For` is set to the single address
    # `real_ip` resolved above — never `$proxy_add_x_forwarded_for`, which
    # appends to whatever the caller sent and would carry a forged prefix
    # straight through to `req.ip`. One entry, so `TRUST_PROXY=1` is exact.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    # Hardcoded, not `$http_x_forwarded_proto`: this block only serves TLS, and
    # an absent header made `req.protocol` resolve to http, which put plain
    # http:// into the absolute upload URLs the API returns.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Security headers for the app origin. The API sets its own via helmet;
    # these cover the documents and assets nginx serves, which helmet never
    # saw. HSTS is a commitment — once a browser has seen it, this host cannot
    # be served over http for `max-age` — which is correct here, since the
    # session cookie already cannot work without TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    client_max_body_size 12m;   # above the API's own 10 MB upload ceiling

    # The API.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        # Speech transcription is CPU-bound and can run well past the 60s
        # default before it answers.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded product images, served by the API from its own disk.
    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public";
        # Repeated, not inherited: a location declaring any `add_header`
        # inherits none of the server block's. Without this, uploaded files
        # were served with no `nosniff` — the one place it matters most.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed build output: immutable, so cache it hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited: a location declaring any `add_header`
        # inherits none of the server block's. Without this, uploaded files
        # were served with no `nosniff` — the one place it matters most.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Everything else is a route the SPA owns.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Repeated, not inherited: a location declaring any `add_header`
        # inherits none of the server block's. Without this, uploaded files
        # were served with no `nosniff` — the one place it matters most.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        expires off;
    }
}
