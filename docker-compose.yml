# Nexus Commerce — single-host stack.
#
# Every secret is read from `.env` next to this file; none is written here.
# The previous version hardcoded
# `SESSION_SECRET: replace_with_a_super_secret_key_at_least_32_chars_long`
# and supplied no payment, SMTP, OAuth or webhook variables at all — so a
# deployment that came up "successfully" had a published placeholder secret and
# a checkout that 503'd on every attempt, because the API had no gateway keys.
#
# A required-with-message reference (the ":?" form) makes compose refuse to
# start when a value is missing, instead of booting a half-configured stack. Copy `.env.example` to
# `.env` and fill it in before `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
    # Bound to loopback, not 0.0.0.0. Publishing 5432 to every interface put
    # the database on the public internet on any host without a firewall.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-nexus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_db}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (32+ random chars)}
      # The browser-facing origin(s), comma-separated. CORS and the CSRF origin
      # guard are both built from this, so a wrong value here is a site that
      # cannot talk to its own API.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Behind nginx. Without this the API sees every request as coming from
      # the proxy, so all clients share one rate-limit bucket.
      TRUST_PROXY: ${TRUST_PROXY:-1}

      # Payments, via Paystack. Checkout returns 503 rather than faking a
      # success when these are absent, so an unset key is a visibly broken
      # checkout rather than a silent one. The secret key also signs webhooks
      # and authorises merchant payout transfers.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}

      # Email. The API exits on boot in production if these are unusable,
      # because a silently dead transport means nobody can reset a password.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS in .env}
      EMAIL_FROM: ${EMAIL_FROM:-Nexus Commerce <no-reply@nexuscommerce.io>}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # The platform's cut of each merchant sale. 0 means merchants are owed
      # 100% and subscriptions are the only platform revenue. Captured per
      # payment at settlement, so a change affects new sales only.
      PLATFORM_COMMISSION_PERCENT: ${PLATFORM_COMMISSION_PERCENT:-5}

      # The currency new stores trade in. MUST match a currency the gateway
      # account has enabled — Paystack rejects anything else outright, which
      # fails every checkout at initialize. Required rather than defaulted:
      # a wrong currency is a stack that boots cleanly and cannot take money,
      # which is exactly what the ":?" form exists to prevent.
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:?set DEFAULT_CURRENCY in .env to a currency enabled on your Paystack account (e.g. NGN)}

      # Platform-wide sales tax. 0 charges none.
      PLATFORM_TAX_PERCENT: ${PLATFORM_TAX_PERCENT:-0}
      PLATFORM_TAX_LABEL: ${PLATFORM_TAX_LABEL:-Tax}
      PLATFORM_TAX_INCLUSIVE: ${PLATFORM_TAX_INCLUSIVE:-false}

      # Recurring jobs run in-process. Set false on all but one replica if you
      # scale the API beyond a single instance.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}

      WHISPER_MODEL: ${WHISPER_MODEL:-onnx-community/whisper-base.en}
      VOICE_MODEL_DIR: ${VOICE_MODEL_DIR:-.models}

      # Transcription runs in worker threads so it cannot block the API.
      # Each worker holds its own copy of the model (~76MB), so raising this
      # raises the container's memory accordingly — size the host for it.
      VOICE_WORKERS: ${VOICE_WORKERS:-2}
      VOICE_TIMEOUT_MS: ${VOICE_TIMEOUT_MS:-60000}
      VOICE_MAX_QUEUE: ${VOICE_MAX_QUEUE:-12}
    volumes:
      # Product images live on disk. Without this volume every image a merchant
      # uploaded vanished on the next redeploy.
      - uploads_data:/app/uploads
      # Speech models, so a rebuilt image does not re-download ~143 MB.
      - voice_models:/app/.models
    # Not published. nginx reaches it over the compose network; exposing 5000
    # to the host let callers bypass the proxy and its forwarded headers.
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite inlines these at build time; the compose `environment:` block
      # cannot reach a bundle that has already been built.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BASE: ${VITE_BASE:-/}
        VITE_APP_NAME: ${VITE_APP_NAME:-Nexus Commerce}
        VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY:-}
        # Fed by the SAME .env line as the API's DEFAULT_CURRENCY above, so the
        # browser and the server cannot disagree about what a price means.
        # Five dashboard sections used to hardcode USD; see src/utils/money.ts.
        VITE_DEFAULT_CURRENCY: ${DEFAULT_CURRENCY}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # The Cloudflare Origin Certificate, read-only. nginx will not start
      # without both files, which is the right failure: the session cookie is
      # Secure, so a stack serving plain HTTP cannot log anyone in and should
      # not pretend to be up. See DEPLOYMENT.md for how to generate them.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  voice_models:
